[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-flowhmr"
version = "0.1.0"
description = "External single-camera buffered live mocap bridge (FlowHMR -> VMC & LAPLACE Persona Plugin API)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy<2",
  "opencv-python>=4.9",
  "scipy>=1.11",
  "einops>=0.8",
  "PyYAML>=6.0",
  "omegaconf>=2.3",
  "torchdiffeq>=0.2.4",
  "timm>=1.0",
  "yacs>=0.1.8",
  "roma>=1.5",
  "loguru>=0.7",
  "supervision==0.25.1",
  "pycocotools>=2.0.7",
  "tabulate>=0.9",
  "psutil>=5.9",
  "braceexpand>=0.1.7",
  "pytorch-lightning>=2.4",
  "termcolor>=2.4",
  "ftfy>=6.2",
  "regex>=2024.5",
  "huggingface-hub>=0.26",
  "truststore>=0.10",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=13.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
persona-flowhmr = "persona_flowhmr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
