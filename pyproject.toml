[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "persona-flowhmr"
version = "0.1.0"
description = "External single-camera buffered live mocap bridge (FlowHMR -> VMC & LAPLACE Persona Plugin API)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10,<3.13"
dependencies = [
  "braceexpand>=0.1.7",
  "einops>=0.8",
  "fastapi>=0.115",
  "ftfy>=6.2",
  "huggingface-hub>=0.26",
  "loguru>=0.7",
  "numpy>=1.26,<2",
  "omegaconf>=2.3",
  "opencv-python>=4.9",
  "psutil>=5.9",
  "pycocotools>=2.0.7",
  "python-multipart>=0.0.12",
  "pytorch-lightning>=2.4",
  "pyyaml>=6.0",
  "regex>=2024.5",
  "roma>=1.5",
  "scipy>=1.11",
  "supervision==0.25.1",
  "tabulate>=0.9",
  "termcolor>=2.4",
  "timm>=1.0",
  "torch>=2.7",
  "torchdiffeq>=0.2.4",
  "torchvision>=0.22",
  "triton-windows>=3.3; sys_platform == 'win32'",
  "truststore>=0.10",
  "uvicorn>=0.32",
  "websockets>=13.0",
  "yacs>=0.1.8",
]

[project.scripts]
persona-flowhmr = "persona_flowhmr.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/persona_flowhmr"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
